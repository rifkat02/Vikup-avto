<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoExpert — Выкуп и Подбор</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e22;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --border-color: #27272a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Навигация (вкладки) */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Формы и карточки */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #18181b;
            border: 1px solid var(--border-color);
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Список каталога */
        .car-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .car-card:last-child { border-bottom: none; }
        .car-price { font-size: 18px; font-weight: bold; color: #60a5fa; }
    </style>
</head>
<body>

    <!-- Шапка авторизации -->
    <div id="user-info" style="margin-bottom: 15px; font-size: 14px; color: var(--text-sub);">
        Авторизация через MAX...
    </div>

    <!-- Вкладки меню -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('buyout')">Выкуп</button>
        <button class="tab-btn" onclick="switchTab('search')">Подбор</button>
        <button class="tab-btn" onclick="switchTab('catalog')">Авто в наличии</button>
    </div>

    <!-- Вкладка 1: Срочный выкуп -->
    <div id="tab-buyout" class="tab-content active">
        <div class="card">
            <h3>Оценка и выкуп авто</h3>
            <form id="buyout-form" onsubmit="submitForm(event, 'Выкуп')">
                <div class="form-group">
                    <label>Марка и модель</label>
                    <input type="text" placeholder="Например: Toyota Camry" required>
                </div>
                <div class="form-group">
                    <label>Год выпуска</label>
                    <input type="number" placeholder="2018" required>
                </div>
                <div class="form-group">
                    <label>Пробег (км)</label>
                    <input type="number" placeholder="85000" required>
                </div>
                <div class="form-group">
                    <label>Желаемая цена (₽)</label>
                    <input type="number" placeholder="1 800 000" required>
                </div>
                <div class="form-group">
                    <label>Состояние / Описание</label>
                    <textarea rows="3" placeholder="Укажите окрасы, ДТП или нюансы"></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить на оценку</button>
            </form>
        </div>
    </div>

    <!-- Вкладка 2: Подбор авто -->
    <div id="tab-search" class="tab-content">
        <div class="card">
            <h3>Заявка на автоподбор</h3>
            <form id="search-form" onsubmit="submitForm(event, 'Подбор')">
                <div class="form-group">
                    <label>Максимальный бюджет (₽)</label>
                    <input type="number" placeholder="2 500 000" required>
                </div>
                <div class="form-group">
                    <label>Желаемый тип кузова</label>
                    <select>
                        <option value="sedan">Седан</option>
                        <option value="suv">Кроссовер / Внедорожник</option>
                        <option value="hatchback">Хэтчбек</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Пожелания по маркам и комплектации</label>
                    <textarea rows="3" placeholder="Например: Kia Optima / Hyundai Sonata от 2019 года, 1 владелец"></textarea>
                </div>
                <button type="submit" class="btn-submit">Оставить заявку</button>
            </form>
        </div>
    </div>

    <!-- Вкладка 3: Каталог -->
    <div id="tab-catalog" class="tab-content">
        <div class="card">
            <h3>Автомобили в наличии</h3>
            <div class="car-card">
                <strong>BMW 3 Series (G20), 2020</strong>
                <span class="car-price">3 450 000 ₽</span>
                <small style="color: var(--text-sub);">2.0 л / 190 л.с. / Дизель / 62 000 км</small>
                <button class="btn-submit" style="margin-top: 8px; padding: 8px;" onclick="requestCar('BMW 3 G20')">Запросить осмотр</button>
            </div>
            <div class="car-card">
                <strong>Mazda CX-5, 2021</strong>
                <span class="car-price">2 800 000 ₽</span>
                <small style="color: var(--text-sub);">2.5 л / 194 л.с. / Бензин / 38 000 км</small>
                <button class="btn-submit" style="margin-top: 8px; padding: 8px;" onclick="requestCar('Mazda CX-5')">Запросить осмотр</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация MAX App SDK
        let maxUser = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (window.MaxWebApp) {
                window.MaxWebApp.ready();
                maxUser = window.MaxWebApp.initDataUnsafe?.user;
                if (maxUser) {
                    document.getElementById('user-info').innerText = `Пользователь: ${maxUser.first_name} (@${maxUser.username || maxUser.id})`;
                }
            } else {
                document.getElementById('user-info').innerText = "Режим отладки (вне мессенджера MAX)";
            }
        });

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // Отправка формы
        function submitForm(event, type) {
            event.preventDefault();
            
            const payload = {
                type: type,
                userId: maxUser ? maxUser.id : 'debug_user',
                userName: maxUser ? maxUser.first_name : 'Тест',
                timestamp: new Date().toISOString()
            };

            alert(`Заявка на ${type} успешно отправлена! Менеджер свяжется с вами в чате.`);
            
            // Если есть MAX SDK, можно закрыть окно или отправить данные обратно в бот:
            if (window.MaxWebApp) {
                window.MaxWebApp.sendData(JSON.stringify(payload));
            }
        }

        function requestCar(model) {
            alert(`Запрос по автомобилю ${model} отправлен!`);
        }
    </script>
</body>
</html>
